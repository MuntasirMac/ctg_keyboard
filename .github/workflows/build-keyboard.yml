name: Compile Chittagonian Keyboard Package

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Native Keyman Compiler (kmc)
        run: npm install -g @keymanapp/kmc

      - name: Compile Keyboard File
        run: |
          cd keyboards/chittagonian
          kmc build chittagonian.kmn

      - name: Commit and Push Compiled Binary
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add keyboards/chittagonian/chittagonian.kmp || true
          git add keyboards/chittagonian/chittagonian.js || true
          git diff-index --quiet HEAD || git commit -m "chore: auto-compiled .kmp package [skip ci]"
          git push origin HEAD
